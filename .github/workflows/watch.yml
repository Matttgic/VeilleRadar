name: VeilleRadar - Surveillance et publication
on:
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: veilleradar-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Tests de sécurité et du moteur
        run: python -m unittest discover -s tests -v
      - name: Vérifier les pages publiques
        run: python monitor.py
      - name: Enregistrer les observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: actualiser les surveillances'
            git push origin HEAD:main
          fi
      - name: Envoyer les alertes Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

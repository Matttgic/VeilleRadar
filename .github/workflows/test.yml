name: VeilleRadar - Validation des fonctionnalités
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'docs/compare-core.js'
      - 'docs/comparer.js'
      - 'docs/comparer.html'
      - 'tests/test_compare.js'
      - '.github/workflows/test.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: |
          node --check docs/compare-core.js
          node --check docs/comparer.js
          node --test tests/test_compare.js
